<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<title>🐾 أصدقاء الحيوانات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="scenery" aria-hidden="true"></div>

  <!-- ============ شاشة البداية ============ -->
  <section id="screen-start" class="screen active">
    <div class="start-animals" id="start-animals" aria-hidden="true"></div>
    <div class="start-center">
      <h1 class="title"><span class="t-paw">🐾</span> أصدقاء الحيوانات <span class="t-tree">🌳</span></h1>
      <div class="start-mascot" id="start-mascot"></div>
      <button class="btn-big pulse" id="btn-start"><span class="ico">▶️</span> ابدأ المغامرة</button>
    </div>
    <div class="start-bar">
      <button class="icon-btn" id="start-sound" title="الصوت" aria-label="الصوت">🔊</button>
      <button class="icon-btn" id="start-music" title="الموسيقى" aria-label="الموسيقى">🎵</button>
      <button class="icon-btn" id="start-help" title="المساعدة" aria-label="المساعدة">❓</button>
      <div class="star-counter" aria-label="النجوم"><span>⭐</span><b class="star-total">0</b></div>
    </div>
  </section>

  <!-- ============ خريطة عالم الحيوانات ============ -->
  <section id="screen-map" class="screen">
    <header class="hud">
      <button class="icon-btn" id="map-home" title="الرئيسية" aria-label="الرئيسية">🏠</button>
      <h2 class="map-title">🗺️ خريطة عالم الحيوانات</h2>
      <div class="hud-end">
        <button class="icon-btn" id="map-settings" title="الإعدادات" aria-label="الإعدادات">⚙️</button>
        <div class="star-counter"><span>⭐</span><b class="star-total">0</b></div>
      </div>
    </header>
    <div class="map-wrap"><div class="mapboard" id="mapboard"></div></div>
    <div class="map-mascot" id="map-mascot"></div>
  </section>

  <!-- ============ شاشة اللعب ============ -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <button class="icon-btn" id="game-map" title="الخريطة" aria-label="الخريطة">🗺️</button>
      <div class="hud-info">
        <div class="hud-line"><span class="lvl-txt" id="hud-level">المستوى 1 / 10</span><span class="rnd-txt" id="hud-round">الجولة 1 / 5</span></div>
        <div class="progress" id="hud-progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="hud-end">
        <button class="icon-btn" id="game-sound" title="كتم الصوت" aria-label="كتم الصوت">🔊</button>
        <button class="icon-btn" id="game-settings" title="الإعدادات" aria-label="الإعدادات">⚙️</button>
        <div class="star-counter" id="hud-stars"><span>⭐</span><b class="star-total">0</b></div>
      </div>
    </header>
    <div id="prompt" class="prompt"><button class="prompt-replay" id="prompt-replay" aria-label="إعادة التعليمات">🔈</button><span id="prompt-text">…</span></div>
    <main id="stage"></main>
    <div class="game-mascot" id="game-mascot"></div>
  </section>

  <!-- ============ إكمال المستوى ============ -->
  <section id="screen-level" class="screen">
    <div class="center-col">
      <h1 class="big-title" id="lc-title">🎉 أحسنت!</h1>
      <div class="dance-row" id="lc-animals"></div>
      <div class="lc-mascot" id="lc-mascot"></div>
      <div class="stars-row" id="lc-stars"></div>
      <div class="btn-row">
        <button class="btn-big" id="lc-next"><span class="ico">▶️</span> المستوى التالي</button>
        <button class="btn-big alt" id="lc-map"><span class="ico">🗺️</span> الخريطة</button>
      </div>
    </div>
  </section>

  <!-- ============ شاشة النهاية ============ -->
  <section id="screen-final" class="screen">
    <div class="center-col">
      <div class="trophy">🏆</div>
      <h1 class="big-title">بطل الحيوانات</h1>
      <div class="dance-row" id="fin-animals"></div>
      <div class="lc-mascot" id="fin-mascot"></div>
      <div class="stars-row"><span class="fin-stars">⭐ <b class="star-total">0</b></span></div>
      <div class="btn-row">
        <button class="btn-big" id="fin-again"><span class="ico">🔄</span> العب من جديد</button>
        <button class="btn-big alt" id="fin-map"><span class="ico">🗺️</span> العودة إلى الخريطة</button>
      </div>
    </div>
  </section>

  <!-- ============ نوافذ ============ -->
  <div class="modal" id="modal-settings" hidden>
    <div class="modal-card">
      <h2>⚙️ الإعدادات</h2>
      <div class="set-grid">
        <button class="set-btn" id="set-sound" data-on="1"><span class="ico">🔊</span><span>الأصوات</span><i class="onoff"></i></button>
        <button class="set-btn" id="set-music" data-on="1"><span class="ico">🎵</span><span>الموسيقى</span><i class="onoff"></i></button>
        <button class="set-btn" id="set-voice" data-on="1"><span class="ico">🗣️</span><span>التعليمات الصوتية</span><i class="onoff"></i></button>
        <button class="set-btn danger" id="set-reset"><span class="ico">🔄</span><span>إعادة التقدم</span><small>اضغط مطولاً</small><i class="hold"></i></button>
      </div>
      <button class="btn-big small" id="set-close"><span class="ico">✔️</span> تم</button>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-card">
      <h2>❓ كيف ألعب؟</h2>
      <div class="help-steps">
        <div><span class="hs-ico">🔊</span><p>اسمع صوت الحيوان</p></div>
        <div><span class="hs-ico">👆</span><p>اضغط على الحيوان الصحيح</p></div>
        <div><span class="hs-ico">⭐</span><p>اجمع النجوم وافتح المناطق</p></div>
        <div><span class="hs-ico">🤝</span><p>إذا أخطأت جرّب من جديد، لا بأس!</p></div>
      </div>
      <button class="btn-big small" id="help-close"><span class="ico">✔️</span> فهمت</button>
    </div>
  </div>

  <div id="fx" aria-hidden="true"></div>
</div>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="activities.js"></script>
</body>
</html>
